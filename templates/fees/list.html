{% extends 'base.html' %}{% load fee_extras %}{% block content %}<h1>Fees</h1><table class="table"><tr><th>Student</th><th>Fee</th><th>Paid</th><th>Due</th><th></th></tr>{% for payment in payments %}<tr><td>{{ payment.student }}</td><td>{{ payment.fee_structure }}</td><td>{{ payment.amount_paid|money }}</td><td>{{ payment.outstanding|money }}</td><td><a href="{% url 'fees:receipt' payment.id %}">Receipt</a></td></tr>{% empty %}<tr><td>No fee records.</td></tr>{% endfor %}</table>{% endblock %}
