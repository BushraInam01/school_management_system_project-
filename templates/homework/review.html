{% extends 'base.html' %}{% block content %}<h1>Review {{ submission.student }}</h1><p>{{ submission.text }}</p>{% if submission.file %}<p><a href="{% url 'homework:submission_download' submission.pk %}">Download {{ submission.file_original_name|default:'submission' }}</a></p>{% endif %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Mark reviewed</button></form>{% endblock %}
